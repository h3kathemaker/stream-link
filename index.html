.link-server::before {

/* СТИЛИЗАЦИЯ И ПОДСВЕТКА ВЕКТОРНОЙ МАСКИ */
.server-logo-svg {
    width: 24px;
    height: 24px;
    display: block;
    filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.5)); /* Мягкое золотистое свечение маски */
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
}

/* ЖИВАЯ ЗЕЛЕНАЯ ТОЧКА */
.online-dot {
    width: 6px;
    height: 6px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    position: relative;
    flex-shrink: 0;
}

.online-dot::after {
    content: '';
    position: absolute;
    top: -5px;
    left: -5px;
    width: 16px;
    height: 16px;
    border: 1.5px solid #10b981;
    border-radius: 50%;
    opacity: 0;
    animation: dotPulse 2s infinite ease-out;
    box-sizing: border-box;
}

.server-text {
    font-weight: 500;
}

/* Анимация при наведении */
.link-server:hover .server-logo-svg {
    transform: scale(1.2) rotate(5deg);
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9));
}

@keyframes dotPulse {
    0% { transform: scale(0.4); opacity: 0; }
    50% { opacity: 0.6; }
    100% { transform: scale(1.2); opacity: 0; }
}/* Эффект анимации маски при наведении на кнопку */
.link-server:hover .server-logo {
    transform: scale(1.15);
    border-color: rgba(16, 185, 129, 0.7);
    box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
}

/* Волна от зеленой точки */
@keyframes dotPulse {
    0% { transform: scale(0.4); opacity: 0; }
    50% { opacity: 0.6; }
    100% { transform: scale(1.2); opacity: 0; }
}

            transform: translateY(3px);

        /* СЕКЦИЯ ПОРТФОЛИО: СЕТКА И СТИЛИ ДЛЯ СЛОТОВ-ССЫЛОК */
        .video-section {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 2.5rem;
            margin-bottom: 4rem;
            scroll-margin-top: 2rem;
        }

        .video-slot {
            position: relative;
            display: block;
            width: 100%;
            padding-bottom: 56.25%; /* Пропорции 16:9 */
            height: 0;
            background: #0a0b0e;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        border-color 0.4s ease, 
                        box-shadow 0.4s ease;
        }

        /* Превью-картинка */
        .video-slot img {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.4s ease;
            filter: brightness(0.85);
        }

        /* Контейнер кнопки Play */
        .video-slot .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 65px;
            height: 45px;
            background: rgba(10, 11, 14, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 3;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background 0.3s ease, 
                        border-color 0.3s ease, 
                        box-shadow 0.3s ease;
        }

        /* Треугольник внутри Play */
        .video-slot .play-btn-arrow {
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-left: 16px solid #ffffff;
            border-bottom: 9px solid transparent;
            margin-left: 4px;
            transition: border-left-color 0.3s ease;
        }

        /* --- ЭФФЕКТЫ МЯГКОЙ ПОДСВЕТКИ ПРИ НАВЕДЕНИИ --- */
        .video-slot:hover {
            transform: translateY(-6px) scale(1.015);
            border-color: rgba(99, 102, 241, 0.4); 
            
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8), 
                0 0 40px rgba(99, 102, 241, 0.15), 
                0 0 80px rgba(168, 85, 247, 0.08); 
        }

        .video-slot:hover img {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .video-slot:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.1);
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .video-slot:hover .play-btn-arrow {
            border-left-color: #050507;
        }


        /* Анимации плашки LIVE */
        @keyframes pulseLive {
            0% { transform: translateX(-50%) translateZ(15px) scale(1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
            15% { transform: translateX(-50%) translateZ(15px) scale(1.05); box-shadow: 0 0 18px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.6); }

            70%, 100% { transform: translateX(-50%) translateZ(15px) scale(1); box-shadow: 0 0 10px rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); }
        }

        @keyframes shineGlare {
            0% { left: -150%; }
            15%, 100% { left: 150%; }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('main-card');
            
            if (window.innerWidth > 768) {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    
                    const rotateX = -(y / (rect.height / 2)) * 7;
                    const rotateY = (x / (rect.width / 2)) * 7;
                    
                    card.style.transition = 'transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.15s ease-out';
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
                    card.style.boxShadow = `${-rotateY * 3}px ${-rotateX * 3}px 90px rgba(0, 0, 0, 0.95)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.8s ease-out';
                    card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
                    card.style.boxShadow = '0 30px 70px rgba(0, 0, 0, 0.8)';
                });
            }
        });
    </script>

</body>
</html>
